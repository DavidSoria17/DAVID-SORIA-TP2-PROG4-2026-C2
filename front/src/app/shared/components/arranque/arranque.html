<div class="logo">
  @if (icono(); as nombre) {
    <app-icono [nombre]="nombre" [escala]="6" />
  } @else {
    <img class="logo__imagen" ngSrc="iconos/apps/logo.png" width="64" height="52" priority alt="" />
  }
  <span>{{ titulo() }}</span>
</div>
<span class="version">{{ subtitulo() }}</span>
<ul class="registro">
  @for (linea of lineas(); track $index) {
    <li>
      @if (linea.lista) {
        <b>[ OK ]</b>
      } @else {
        <span>[ .. ]</span>
      }
      {{ linea.texto }}
    </li>
  }
</ul>
<div class="progreso">
  <div class="progreso__datos">
    <span>{{ etiquetaProgreso() }}</span>
    <span>{{ progreso() }} %</span>
  </div>
  <div
    class="progreso__pista"
    role="progressbar"
    aria-valuemin="0"
    aria-valuemax="100"
    [attr.aria-label]="etiquetaProgreso()"
    [attr.aria-valuenow]="progreso()"
  >
    <div class="progreso__relleno" [style.--valor.%]="progreso()"></div>
  </div>
</div>
<ng-content />
