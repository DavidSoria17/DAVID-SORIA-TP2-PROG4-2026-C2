@if (urlImagen(); as url) {
  <img [src]="url" [alt]="'Foto de perfil de @' + nombreUsuario()" />
} @else {
  <span class="solo-lectores">{{ '@' + nombreUsuario() }} no tiene foto de perfil</span>
  <app-icono class="silueta" nombre="usuario" [escala]="escalaSilueta()" />
  <span class="inicial" aria-hidden="true">{{ inicial() }}</span>
}
