<h1 class="solo-lectores">Tweeter</h1>
@if (usuario(); as sesion) {
  <div class="barra-herramientas">
    <div class="selector-orden" role="radiogroup" aria-labelledby="orden-publicaciones">
      <span id="orden-publicaciones">Ordenar por</span>
      <div class="selector-orden__opciones">
        <label class="selector-orden__opcion">
          <input type="radio" name="orden" value="fecha" [formControl]="orden" />
          <span><app-icono nombre="reloj" [escala]="1" />Más nuevas</span>
        </label>
        <label class="selector-orden__opcion">
          <input type="radio" name="orden" value="meGusta" [formControl]="orden" />
          <span><app-icono nombre="corazon" [escala]="1" />Más me gusta</span>
        </label>
      </div>
    </div>
    <a class="boton boton--primario" routerLink="/publicaciones/nueva">
      <app-icono nombre="mas" [escala]="1" />
      Nueva publicación
    </a>
  </div>

  <div class="pila">
    @if (error(); as mensaje) {
      <app-aviso
        tipo="peligro"
        titulo="No pudimos cargar las publicaciones"
        [texto]="mensaje"
        (cerrar)="error.set(null)"
      />
    }

    @for (publicacion of publicaciones(); track publicacion._id) {
      <app-publicacion-card
        [publicacion]="publicacion"
        [propia]="publicacion.autor._id === sesion._id"
        [eliminable]="publicacion.autor._id === sesion._id"
        (alternarMeGusta)="alternarMeGusta(publicacion)"
        (eliminar)="eliminar(publicacion)"
      />
    } @empty {
      @if (cargada() && !error()) {
        <app-estado-vacio titulo="Todavía no hay publicaciones" />
      }
    }

    @if (total() > 0) {
      <app-paginador
        elementos="publicaciones"
        [pagina]="pagina()"
        [porPagina]="porPagina"
        [total]="total()"
        (cambiar)="irAPagina($event)"
      />
    }
  </div>
} @else {
  <app-estado-vacio titulo="No iniciaste sesión" texto="Entrá con tu cuenta para ver Tweeter.">
    <a class="boton boton--primario" routerLink="/login">Iniciar sesión</a>
  </app-estado-vacio>
}
