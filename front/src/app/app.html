<router-outlet />

<div class="avisos">
  @for (aviso of notificacionService.avisos(); track aviso.id) {
    <app-aviso
      [tipo]="aviso.tipo"
      [titulo]="aviso.titulo"
      [texto]="aviso.texto"
      [duracion]="notificacionService.duracion"
      (cerrar)="notificacionService.cerrar(aviso.id)"
    />
  }
</div>

<app-spinner-cursor [visible]="cargaService.visible()" />
